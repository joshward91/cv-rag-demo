<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.anthropic.com; base-uri 'none'; form-action 'none'" />
<meta name="referrer" content="no-referrer" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Harbour CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
</head>
<body>
<style>/* Layout: fixed navy sidebar, light working canvas, help assistant docked bottom right. */
:root {
  --ink: #15212b;
  --ink-soft: #4a5a68;
  --ink-faint: #7a8996;
  --canvas: #f3f6f8;
  --surface: #ffffff;
  --line: #dde4ea;
  --line-strong: #c3ced7;
  --side: #13242f;
  --side-ink: #c9d6df;
  --side-active: #ffffff;
  --accent: #0b6f73;
  --accent-ink: #ffffff;
  --accent-soft: #e2f1f1;
  --won: #237a46;
  --won-soft: #e3f3e8;
  --lost: #b0412e;
  --lost-soft: #f9e7e3;
  --clarify: #9a6408;
  --clarify-soft: #fbf0d9;
  --code-bg: #eef2f5;
  --shadow: 0 10px 30px rgba(17, 34, 46, 0.14);
  --font-ui: 'Hanken Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --ink: #e4ebf0; --ink-soft: #a9b7c2; --ink-faint: #7f8f9b; --canvas: #0e171e; --surface: #15212a; --line: #26343f; --line-strong: #364754;
    --side: #0a1218; --side-ink: #a9b9c4; --side-active: #ffffff; --accent: #4fb8b5; --accent-ink: #0b1a1f; --accent-soft: #143436;
    --won: #6cc58e; --won-soft: #15301f; --lost: #ef8a76; --lost-soft: #3a1d17; --clarify: #e7b35a; --clarify-soft: #362a12; --code-bg: #1d2b35;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45); color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --ink: #e4ebf0; --ink-soft: #a9b7c2; --ink-faint: #7f8f9b; --canvas: #0e171e; --surface: #15212a; --line: #26343f; --line-strong: #364754;
  --side: #0a1218; --side-ink: #a9b9c4; --side-active: #ffffff; --accent: #4fb8b5; --accent-ink: #0b1a1f; --accent-soft: #143436;
  --won: #6cc58e; --won-soft: #15301f; --lost: #ef8a76; --lost-soft: #3a1d17; --clarify: #e7b35a; --clarify-soft: #362a12; --code-bg: #1d2b35;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
a { color: var(--accent); }
code, pre { font-family: var(--font-mono); font-size: 0.82em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 16px; top: 16px; z-index: 50; background: var(--surface); padding: 8px 12px; }
.muted { color: var(--ink-faint); }

/* Shell ------------------------------------------------------------------ */
.shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100%; }
.sidebar { background: var(--side); color: var(--side-ink); padding: 20px 14px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--side-active); padding: 0 8px; }
.brand-name { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.01em; }
.sidebar nav { display: flex; flex-direction: column; gap: 2px; }
.sidebar nav a { color: var(--side-ink); text-decoration: none; padding: 8px 10px; border-radius: 6px; font-weight: 500; }
.sidebar nav a:hover { color: var(--side-active); background: rgba(255, 255, 255, 0.06); }
.sidebar nav a.active { color: var(--side-active); background: rgba(255, 255, 255, 0.1); box-shadow: inset 3px 0 0 #5cc4c0; }
.demo-note { margin-top: auto; font-size: 0.78rem; color: var(--side-ink); padding: 0 8px; display: flex; flex-direction: column; gap: 8px; }
.demo-note p { margin: 0; opacity: 0.8; }
.demo-note a { color: #8fd6d2; font-weight: 600; }
.workspace { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 32px; border-bottom: 1px solid var(--line); background: var(--surface); }
.account-name { font-weight: 600; }
.topbar-meta { font-size: 0.78rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; }
main { padding: 24px 32px 120px; display: flex; flex-direction: column; gap: 20px; outline: none; max-width: 1180px; width: 100%; }

.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs { display: flex; gap: 6px; font-size: 0.85rem; color: var(--ink-faint); margin-bottom: -10px; }
.crumbs a { color: var(--ink-soft); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.lede { color: var(--ink-soft); max-width: 62ch; margin: -8px 0 0; }

/* Controls ---------------------------------------------------------------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-weight: 600; font-size: 0.9rem; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); text-decoration: none; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink-faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--lost); }
.btn.danger:hover { border-color: var(--lost); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.won { color: var(--won); border-color: var(--won); }
.btn.lost { color: var(--lost); border-color: var(--lost); }
.btn.small { padding: 5px 10px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.link-button { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 2px; }

input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
select:disabled { opacity: 0.7; }

.filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.filters input[type='search'] { flex: 1 1 260px; width: auto; }
.filters select { width: auto; }
.filter-group { display: inline-flex; align-items: center; gap: 6px; }
.inline-label { font-size: 0.85rem; color: var(--ink-soft); }

/* Tables ------------------------------------------------------------------- */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--canvas); }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
th.num, td.num { text-align: right; }
td.num:not(:last-child) { text-align: left; }
.row-link { font-weight: 600; text-decoration: none; }
.row-link:hover { text-decoration: underline; }
.row-actions { text-align: right; white-space: nowrap; }
.row-actions .btn { margin-left: 4px; }
.table-foot { font-size: 0.82rem; color: var(--ink-faint); margin: 8px 0 0; }
.empty { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 28px; color: var(--ink-soft); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }

.chip { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--code-bg); color: var(--ink-soft); }
.chip.status-customer { background: var(--won-soft); color: var(--won); }
.chip.status-lead { background: var(--accent-soft); color: var(--accent); }

/* Detail pages ------------------------------------------------------------- */
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.facts { margin: 0; display: grid; gap: 10px; }
.facts div { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 10px; }
.facts dt { color: var(--ink-faint); font-size: 0.88rem; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.link-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.notes li { border-top: 1px solid var(--line); padding-top: 10px; }
.notes time { font-size: 0.78rem; color: var(--ink-faint); }
.notes p { margin: 2px 0 0; }
.note-form { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.note-form label { font-weight: 600; font-size: 0.88rem; }
.close-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.closed-state { margin: 0; font-weight: 600; }
.closed-state.won { color: var(--won); }
.closed-state.lost { color: var(--lost); }
.panel > label { font-weight: 600; font-size: 0.88rem; }

/* Forms ------------------------------------------------------------------- */
.form { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 18px; max-width: 760px; }
.field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label, .field .label { font-weight: 600; font-size: 0.88rem; }
.field .static { margin: 0; color: var(--ink-soft); }
.req { color: var(--lost); }
.hint { font-size: 0.8rem; color: var(--ink-faint); }
.key-warning { border: 1px solid var(--clarify); border-left-width: 4px; background: var(--clarify-soft); border-radius: 8px; padding: 10px 12px; font-size: 0.8rem; line-height: 1.45; }
.key-warning p { margin: 0 0 4px; }
.key-warning ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.error { font-size: 0.82rem; color: var(--lost); font-weight: 600; }
.error:empty { display: none; }
.field.invalid input, .field.invalid select { border-color: var(--lost); }
.form-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.custom-fields { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 18px; margin: 0; }
.custom-fields legend { font-weight: 700; padding: 0 6px; font-size: 0.9rem; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs a { padding: 8px 14px; text-decoration: none; color: var(--ink-soft); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a[aria-selected='true'] { color: var(--accent); border-bottom-color: var(--accent); }

/* Deal board -------------------------------------------------------------- */
.board { display: grid; grid-template-columns: repeat(6, minmax(170px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.column { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
.column header { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 2px 4px 6px; border-bottom: 1px solid var(--line); }
.column-total { font-size: 0.8rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.stage-won header h2 { color: var(--won); }
.stage-lost header h2 { color: var(--lost); }
.deal-card { display: flex; flex-direction: column; gap: 2px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: var(--ink); background: var(--canvas); }
.deal-card:hover { border-color: var(--accent); }
.deal-name { font-weight: 600; font-size: 0.9rem; }
.deal-meta { font-size: 0.8rem; color: var(--ink-faint); }
.deal-value { font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.column-empty { font-size: 0.82rem; color: var(--ink-faint); margin: 4px; }

/* Help -------------------------------------------------------------------- */
.help-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; align-items: start; }
.help-article { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; max-width: 72ch; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { margin: 0; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); }
.eyebrow code { text-transform: none; letter-spacing: 0; }
.aliases { margin: 0; font-size: 0.88rem; color: var(--ink-soft); }
.aliases span { font-weight: 600; color: var(--ink); margin-right: 4px; }
.article-body p, .article-body ol, .article-body ul { margin: 0 0 10px; }
.article-body li { margin-bottom: 4px; }
.look-alikes { border-top: 1px solid var(--line); padding-top: 12px; }
.look-alikes ul { margin: 8px 0 0; padding-left: 18px; }
.open-screen { margin: 0; font-weight: 600; }

/* Modal and toast ----------------------------------------------------------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(10, 20, 28, 0.45); z-index: 60; }
.modal { position: fixed; z-index: 61; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border-radius: 10px; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; outline: none; }
.modal h2 { font-size: 1.15rem; text-transform: none; letter-spacing: 0; color: var(--ink); }
.modal p { margin: 0; }
.modal textarea { font-size: 0.85rem; }
.selectable { user-select: all; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: var(--canvas); padding: 10px 16px; border-radius: 8px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 70; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Chat -------------------------------------------------------------------- */
.chat-launcher { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; box-shadow: var(--shadow); cursor: pointer; }
.chat-panel { position: fixed; right: 20px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 41; width: min(460px, calc(100vw - 40px)); height: min(720px, calc(100vh - 110px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.chat-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.chat-head h2 { font-size: 1rem; text-transform: none; letter-spacing: 0; color: var(--ink); }
.chat-sub { margin: 2px 0 0; font-size: 0.8rem; color: var(--ink-faint); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); border-radius: 6px; padding: 6px; cursor: pointer; display: inline-flex; }
.chat-settings { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--canvas); display: flex; flex-direction: column; gap: 10px; }
.chat-settings fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.chat-settings legend { font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; }
.mode-option { display: flex; gap: 10px; align-items: flex-start; font-size: 0.88rem; }
.mode-option input { width: auto; margin-top: 4px; }
.mode-option > span { display: flex; flex-direction: column; }
.chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.chat-welcome p { margin: 0 0 10px; color: var(--ink-soft); font-size: 0.92rem; }
.suggest-label { font-weight: 600; color: var(--ink) !important; }
.suggestions { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.suggestion, .option { font: inherit; font-size: 0.88rem; text-align: left; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 11px; cursor: pointer; }
.suggestion:hover, .option:hover { border-color: var(--accent); color: var(--accent); }
.msg { max-width: 100%; font-size: 0.92rem; display: flex; flex-direction: column; gap: 8px; }
.msg p { margin: 0; }
.msg.user { align-self: flex-end; max-width: 85%; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 12px 12px 2px 12px; }
.msg.bot { align-self: stretch; background: var(--canvas); border: 1px solid var(--line); padding: 12px; border-radius: 2px 12px 12px 12px; }
.msg.pending { color: var(--ink-faint); font-style: italic; }
.msg.error { border-color: var(--lost); }
.answer ol, .answer ul { margin: 6px 0; padding-left: 20px; }
.answer p { margin: 0 0 6px; }
.sources { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sources-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; }
.citation { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 0.82rem; border: 1px solid var(--accent); color: var(--accent); background: var(--surface); padding: 3px 9px 3px 4px; border-radius: 999px; cursor: pointer; text-align: left; }
.also-in { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.also-in .citation { padding-left: 9px; border-color: var(--line); color: var(--ink); }
.option-product { display: inline-block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); margin-right: 6px; }
.filtered-out { margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--lost); border-radius: 8px; background: color-mix(in srgb, var(--lost) 6%, transparent); }
.filtered-out h3 { margin-top: 0; }
.eval-tag { display: inline-block; margin-left: 6px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--lost); }
.internal-banner { margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--lost); border-radius: 8px; font-size: 0.82rem; color: var(--ink); background: color-mix(in srgb, var(--lost) 8%, transparent); }
.product-note { font-size: 0.8rem; color: var(--ink-faint); margin: 0 0 6px; }
.cite-num { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 0.7rem; font-weight: 700; flex: none; }
.options { display: flex; flex-direction: column; gap: 6px; }
.option { border-color: var(--clarify); }
.chat-input { display: flex; gap: 8px; padding: 12px 16px 6px; border-top: 1px solid var(--line); }
.chat-mode-line { margin: 0; padding: 0 16px 10px; font-size: 0.75rem; color: var(--ink-faint); }

.retrieval { border-top: 1px dashed var(--line-strong); padding-top: 6px; }
.retrieval summary { cursor: pointer; font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); }
.retrieval-body { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; font-size: 0.82rem; min-width: 0; }
.retrieval-body h3 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); margin-top: 6px; }
.retrieval-body pre { background: var(--code-bg); padding: 10px; border-radius: 6px; overflow: auto; max-height: 260px; white-space: pre-wrap; word-break: break-word; margin: 0; }
.panel-note { color: var(--ink-soft); margin: 0; }
.terms { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; }
.terms code { background: var(--accent-soft); color: var(--accent); padding: 1px 6px; border-radius: 4px; }
.terms code.unknown { background: var(--lost-soft); color: var(--lost); }
.trace { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 2px; }
.trace code { background: var(--code-bg); padding: 0 4px; border-radius: 3px; }
.scores th, .scores td { padding: 5px 8px; font-size: 0.78rem; }
.scores .matched { display: block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); }
.scores tr.answer td:first-child { box-shadow: inset 3px 0 0 var(--won); }
.scores tr.clarify td:first-child { box-shadow: inset 3px 0 0 var(--clarify); }
.scores tr.context td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.scores tr.excluded td:first-child { box-shadow: inset 3px 0 0 var(--lost); }
.guardrail { margin: 0; color: var(--lost); font-weight: 600; }

.drawer { position: absolute; inset: 0; background: var(--surface); overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 10px; outline: none; }
.drawer .help-article { border: 0; padding: 0; }
.drawer-back { align-self: flex-start; }
.msg.bot > .btn { align-self: flex-start; }
.drawer .article-title { font-size: 1.3rem; }

/* Narrow screens ------------------------------------------------------------ */
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar, .sidebar nav { min-width: 0; }
  .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; }
  .sidebar nav { flex-direction: row; overflow-x: auto; gap: 2px; max-width: 100%; }
  .sidebar nav a { white-space: nowrap; padding: 6px 10px; }
  .sidebar nav a.active { box-shadow: inset 0 -2px 0 #5cc4c0; }
  .demo-note { display: none; }
  .topbar { padding: 10px 16px; }
  main { padding: 18px 16px 110px; }
  .facts div { grid-template-columns: 1fr; gap: 0; }
  .board { grid-template-columns: repeat(6, minmax(200px, 80vw)); }
  .chat-panel { right: 0; left: 0; bottom: 0; top: 0; width: 100%; height: 100%; border-radius: 0; border: 0; padding-top: env(safe-area-inset-top, 0px); }
  .chat-panel:not([hidden]) ~ .chat-launcher, .chat-launcher[aria-expanded='true'] { top: calc(10px + env(safe-area-inset-top, 0px)); bottom: auto; right: 12px; padding: 8px 12px; z-index: 42; }
  .chat-head { padding-right: 140px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

2. Select **Edit**.
3. Replace the address in the **Email** field.
4. Select **Save contact**.

The email address must contain an **@** and a domain, for example sam@example.com. If it doesn't, the form shows **Enter a valid email address** and doesn't save.`,notConfusedWith:["account-billing-email"],screen:"#/contacts"},{id:"contact-change-status",status:"public",category:"Contacts",title:"Change a contact's status",aliases:["convert a lead to a customer","mark a contact as inactive","lifecycle stage","set a contact as a customer"],body:`Every contact has a **Status**: **Lead**, **Customer** or **Inactive**.

1. Go to **Contacts** and open the contact.
2. Select **Edit**.
3. Choose the new value in the **Status** list.
4. Select **Save contact**.

A contact's status is separate from deal stages. Winning a deal doesn't change the contact's status.`,notConfusedWith:["deal-change-stage"],screen:"#/contacts"},{id:"contact-link-company",status:"public",category:"Contacts",title:"Link a contact to a company",aliases:["set a contact's company","assign a contact to an organisation","move a contact to another company","change a contact's employer"],body:`A contact can belong to one company.

1. Go to **Contacts** and open the contact.
2. Select **Edit**.
3. Choose the company in the **Company** list. Choose **No company** to unlink the contact.
4. Select **Save contact**.

The contact now appears under **Contacts at this company** on the company's page. If the company isn't in the list yet, add it first under **Companies**.`,notConfusedWith:["company-create"],screen:"#/contacts"},{id:"contact-delete",status:"public",category:"Contacts",title:"Delete a contact",aliases:["remove a contact","remove a customer","get rid of a contact"],body:`1. Go to **Contacts** and open the contact.
2. Select **Delete**.
3. In the confirmation box, select **Delete contact**.

Deleting a contact also deletes their notes. Deals linked to the contact are kept and show **No contact**. Deleting can't be undone.`,notConfusedWith:["company-delete","deal-delete"],screen:"#/contacts"},{id:"contact-search",status:"public",category:"Contacts",title:"Find a contact",aliases:["search contacts","look up a customer","filter contacts by company","filter contacts by status"],body:`1. Go to **Contacts**.
2. Type in the search box. It matches a contact's name, email address and phone number.
3. To narrow the list further, use the **Company** and **Status** filters next to the search box.

Select **Clear filters** to show every contact again.`,notConfusedWith:[],screen:"#/contacts"},{id:"contact-export",status:"public",category:"Contacts",title:"Export contacts to a CSV file",aliases:["download contacts","download my contact list","contacts spreadsheet","back up contacts"],body:`1. Go to **Contacts**.
2. Optionally search or filter the list. The export includes only the contacts currently shown.
3. Select **Export CSV**.

The file includes each contact's name, email, phone, job title, company, status and custom fields. It opens in Excel, Numbers and Google Sheets.`,notConfusedWith:["contact-search"],screen:"#/contacts"},{id:"contact-add-note",status:"public",category:"Contacts",title:"Add a note to a contact",aliases:["log a call","record a conversation","write up meeting notes","comment on a contact","contact activity"],body:`1. Go to **Contacts** and open the contact.
2. In the **Notes** section, type in the **Add a note** box.
3. Select **Save note**.

Notes appear newest first with the date they were added. Notes can't be edited after saving.`,notConfusedWith:[],screen:"#/contacts"},{id:"company-create",status:"public",category:"Companies",title:"Add a company",aliases:["create a company","new organisation","add a business","add an organisation"],body:`1. Go to **Companies**.
2. Select **New company**.
3. Enter the **Company name**. All other fields are optional.
4. Optionally add the **Industry**, **Phone**, **Website** and **Address**.
5. Select **Save company**.

To add people to the company, link each contact to it.`,notConfusedWith:["contact-create","contact-link-company"],screen:"#/companies/new"},{id:"company-edit-details",status:"public",category:"Companies",title:"Edit a company's phone number, website or address",aliases:["update a company's details","change an organisation's phone number","update a business's address","new office address for a company","rename a company"],body:`1. Go to **Companies** and open the company.
2. Select **Edit**.
3. Change the **Company name**, **Industry**, **Phone**, **Website** or **Address**.
4. Select **Save company**.

This changes the company's main details only.`,notConfusedWith:["contact-edit-phone","account-client-contact-number","account-business-name"],screen:"#/companies"},{id:"company-delete",status:"public",category:"Companies",title:"Delete a company",aliases:["remove a company","remove an organisation"],body:`1. Go to **Companies** and open the company.
2. Select **Delete**.
3. In the confirmation box, select **Delete company**.

Contacts and deals linked to the company are kept, and their company changes to **No company**. Deleting can't be undone.`,notConfusedWith:["contact-delete"],screen:"#/companies"},{id:"deal-create",status:"public",category:"Deals",title:"Create a deal",aliases:["add a deal","new opportunity","add a sale","log a sale","track a sale"],body:`1. Go to **Deals**.
2. Select **New deal**.
3. Enter a **Deal name** and a **Value**.
4. Optionally choose a **Company**, a **Contact**, a **Stage** and an **Expected close date**. New deals start in the **New** stage unless you choose another.
5. Select **Save deal**.

Values use the currency set in **Settings** > **Client profile**.`,notConfusedWith:[],screen:"#/deals/new"},{id:"deal-change-stage",status:"public",category:"Deals",title:"Move a deal to a different stage",aliases:["change a deal stage","move a deal along the pipeline","progress an opportunity","drag a deal to another column"],body:`Open deals move through four stages: **New**, **Qualified**, **Proposal sent** and **Negotiation**.

2. Choose the new stage in the **Stage** list.

2. Select **Mark as won**.

4. Select **Confirm**.

3. Enter the new amount in **Value**. Use numbers only, without a currency symbol.
4. Select **Save deal**.

1. Go to **Settings** > **Custom fields**.
2. Select **Add custom field**.
3. Enter a **Label**.
4. Choose where it appears in **Applies to**: **Contacts**, **Companies** or **Deals**.
5. Choose a **Type**: **Text**, **Number**, **Date** or **Dropdown**. For a dropdown, enter one option per line in **Options**.
6. Select **Save field**.

4. Save the record.

3. Change the **Label**, or for a dropdown, edit the **Options** (one per line).
4. Select **Save field**.

3. In the confirmation box, select **Delete field**.
